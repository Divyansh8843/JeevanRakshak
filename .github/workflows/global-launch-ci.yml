name: Global Launch CI/CD Pipeline 🚀

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ------------------------------------------------------------------
  # JOB 1: FRONTEND BUILD CHECK (React/Vite)
  # ------------------------------------------------------------------
  frontend-build:
    name: 🏗️ Frontend Build (Vercel Ready)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './client/package-lock.json'

    - name: Install Dependencies
      run: npm ci

    - name: Verify Build
      run: npm run build
      env:
        # these are mock values just to ensure build doesn't fail on missing envs
        VITE_SERVER_URL: "http://localhost:8080" 

  # ------------------------------------------------------------------
  # JOB 2: BACKEND INTEGRITY CHECK (Node.js)
  # ------------------------------------------------------------------
  backend-check:
    name: 🛡️ Backend Integrity (Render Ready)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './server/package-lock.json'

    - name: Install Dependencies
      run: npm ci

    - name: Run Smoke Tests
      run: npm test

  # ------------------------------------------------------------------
  # JOB 3: ML SERVICE CHECK (Python/FastAPI)
  # ------------------------------------------------------------------
  ml-check:
    name: 🧠 ML Service Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ml

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Dependencies
      run: pip install -r requirements.txt

    - name: Syntax Check (Compile)
      run: python -m compileall .

  # ------------------------------------------------------------------
  # JOB 4: DEPLOYMENT STATUS NOTIFICATION
  # ------------------------------------------------------------------
  ready-for-global-launch:
    name: 🌍 Global Launch Status
    needs: [frontend-build, backend-check, ml-check]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Success Message
        run: echo "✅ All systems go! Ready for auto-deployment to Render and Vercel."
